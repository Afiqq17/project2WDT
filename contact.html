<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Unity for Change</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="body5">

  <!-- Dropdown Menu -->
  <div class="dropdown">
    <button class="btn btn-primary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
      Menu
    </button>
    <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
      <li><a class="dropdown-item" href="index.html">Home</a></li>
      <li><a class="dropdown-item" href="about.html">About Us</a></li>
      <li><a class="dropdown-item" href="campaigns.html">Campaigns</a></li>
      <li><a class="dropdown-item" href="getinvolved.html">Get Involved</a></li>
      <li><a class="dropdown-item" href="contact.html">Contact Us</a></li>
      <li><a class="dropdown-item" href="donation.html">Donation</a></li>
    </ul>
  </div>

  <h1>Unity for Change</h1>
  <div class="container my-5">

    <h2 class="text-center mb-4">CONTACT</h2>

    <form class="contact" action="#" method="POST">
      <div class="mb-3">
        <label for="name" class="form-label">Full Name:</label>
        <input type="text" id="name" class="form-control">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address:</label>
        <input type="email" id="email" class="form-control">
      </div>

      <div class="mb-3">
        <label for="subject" class="form-label">Subject:</label>
        <input type="text" id="subject" class="form-control">
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Message:</label>
        <textarea id="message" class="form-control" rows="4"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>

  <!-- Bootstrap JS and dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
  <script src="JAVASCRIPT/script.js"></script>
</body>
</html>
